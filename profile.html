<!DOCTYPE html>
<html lang="ENG">
<head>
    <meta charset="UTF-8">
    <title>Profile-page</title>
    <link rel="stylesheet" href= "style.css">
</head>
<body class="profile-body">
    <header class="main-header">
        <div class="header-left">
            <img src="logo.png" alt="Logo" class="logo">
        </div>
        <div class="header-right">
            <a href="mainpage.html">
                <button class="header-button">HOME</button>
            </a>
            <a href="AboutUs.html">
                <button class="header-button">ABOUT-US</button>
            </a>
            <a href="userdash.html">
                <button class="header-button">USER-PAGE</button>
            </a>
        </div>
    </header>

    <div class="profile-container">
  <h2>User Profile</h2>
  
  <div class="profile-field">
    <label>Name:</label>
    <span id="user-name">Chitra Nayak</span>
  </div>
  
  <div class="profile-field">
    <label>Email:</label>
    <span id="user-email">chitra@example.com</span>
  </div>
  
  <div class="profile-field">
    <label>Password:</label>
    <span id="user-password">********</span>
  </div>

  <button onclick="editProfile()">Edit Profile</button>
</div>

<script>
function editProfile() {
  const newName = prompt("Enter new name:", document.getElementById('user-name').innerText);
  const newEmail = prompt("Enter new email:", document.getElementById('user-email').innerText);
  const newPassword = prompt("Enter new password:", "");

  if(newName) document.getElementById('user-name').innerText = newName;
  if(newEmail) document.getElementById('user-email').innerText = newEmail;
  if(newPassword) document.getElementById('user-password').innerText = "*".repeat(newPassword.length);
}
</script>

</body>
</html>
