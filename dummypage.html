// ================= RENDER =================
function render(arr){
  document.querySelector('.items-container').innerHTML = arr.map(i=>`
    <div class="item-card">
      <img src="${i.img}" alt="${i.name}">
      <h3>${i.name}</h3>
      <p>${i.price} Rs | Popularity: ${i.popularity}</p>
      <button class="wishlist-btn" onclick="addToWishlist('${i.name}', '${i.img}', ${i.price})">❤️</button>
      <button class="mix-btn" onclick="mixAndMatch('${i.name}', '${i.img}', ${i.price})">⭐</button>
    </div>
  `).join('');
}

// ================= WISHLIST =================
let wishlistStack = JSON.parse(localStorage.getItem('wishlistStack')) || [];
function addToWishlist(name,img,price){
  let wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
  if(!wishlist.some(i=>i.name===name)){
    const item={name,img,price};
    wishlist.push(item);
    localStorage.setItem('wishlist',JSON.stringify(wishlist));
    wishlistStack.push({action:'add',item});
    localStorage.setItem('wishlistStack',JSON.stringify(wishlistStack));
    alert("Added to wishlist ❤️");
  }
}

// ================= MIX & MATCH =================
function mixAndMatch(name,img,price){
  const selectedItem={name,img,price};
  let recommendedOptions=items.filter(i=>i.name!==name);
  let recommended=recommendedOptions[Math.floor(Math.random()*recommendedOptions.length)];
  localStorage.setItem('mixSelected',JSON.stringify(selectedItem));
  localStorage.setItem('mixRecommended',JSON.stringify(recommended));
  window.location.href='Mix&Match.html';
}

// ================= SORTING =================
function bubbleSort(arr,key){for(let i=0;i<arr.length-1;i++)for(let j=0;j<arr.length-i-1;j++)if(arr[j][key]>arr[j+1][key])[arr[j],arr[j+1]]=[arr[j+1],arr[j]];return arr;}
function selectionSort(arr,key){for(let i=0;i<arr.length-1;i++){let min=i;for(let j=i+1;j<arr.length;j++)if(arr[j][key]<arr[min][key])min=j;[arr[i],arr[min]]=[arr[min],arr[i]];}return arr;}
function mergeSort(arr,key){if(arr.length<=1)return arr;const mid=Math.floor(arr.length/2);return merge(mergeSort(arr.slice(0,mid),key),mergeSort(arr.slice(mid),key),key);}
function merge(l,r,key){let res=[];while(l.length&&r.length)res.push(l[0][key]<=r[0][key]?l.shift():r.shift());return res.concat(l,r);}
document.getElementById('sortList').onchange=function(){
  let arr=[...items];
  if(this.value==='bubbleAsc') arr=bubbleSort(arr,'price');
  if(this.value==='selectionDesc') arr=selectionSort(arr,'price').reverse();
  if(this.value==='mergeAZ') arr=mergeSort(arr,'name');
  render(arr);
};

// ================= POPULAR ITEMS =================
function heapify(arr,n,i){
  let largest=i,l=2*i+1,r=2*i+2;
  if(l<n&&arr[l].popularity>arr[largest].popularity)largest=l;
  if(r<n&&arr[r].popularity>arr[largest].popularity)largest=r;
  if(largest!==i){[arr[i],arr[largest]]=[arr[largest],arr[i]];heapify(arr,n,largest);}
}
function heapSort(arr){
  let n=arr.length;
  for(let i=Math.floor(n/2)-1;i>=0;i--)heapify(arr,n,i);
  for(let i=n-1;i>0;i--){[arr[0],arr[i]]=[arr[i],arr[0]];heapify(arr,i,0);}
  return arr.reverse();
}
document.getElementById('showPopularBtn').onclick=()=>{ render(heapSort([...items])); };

// ================= BST FOR PRICE SEARCH =================
class BSTNode { constructor(item){ this.item=item; this.left=null; this.right=null; } }
class BST {
  constructor(){ this.root=null; }
  insert(item){
    const node=new BSTNode(item);
    if(!this.root){ this.root=node; return; }
    let current=this.root;
    while(true){
      if(item.price<current.item.price){
        if(!current.left){ current.left=node; break; } else current=current.left;
      } else {
        if(!current.right){ current.right=node; break; } else current=current.right;
      }
    }
  }
  inOrder(node=this.root, arr=[]){
    if(!node) return arr;
    this.inOrder(node.left, arr);
    arr.push(node.item);
    this.inOrder(node.right, arr);
    return arr;
  }
  closestN(price, N=3, category=''){
    const sortedItems = this.inOrder()
      .filter(i => !category || i.category === category)
      .sort((a,b)=>Math.abs(a.price-price)-Math.abs(b.price-price));
    return sortedItems.slice(0,N);
  }
}
const bst=new BST();
items.forEach(i=>bst.insert(i));

// ================= SEARCH =================
function searchItems(){
  const val=document.getElementById('searchBar').value.trim();
  const cat=document.getElementById('categorySelect').value;
  if(!val){ 
    render(cat ? items.filter(i=>i.category===cat) : items); 
    return; 
  }

  let results=[];
  const num=Number(val);
  if(!isNaN(num)){ 
    results=bst.closestN(num,5,cat);
  } else {
    results=items.filter(i=>i.name.toLowerCase().includes(val.toLowerCase()));
    if(cat) results=results.filter(i=>i.category===cat);
  }
  render(results);
}
document.getElementById('searchBar').oninput=searchItems;
